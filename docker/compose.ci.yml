name: gpool-ci

services:
  postgres:
    security_opt:
      - no-new-privileges:true
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gpool_admin
      POSTGRES_PASSWORD: app
      POSTGRES_DB: gpool_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '5433:5432'

  # The browser suite signs in through the real Google callback code, so CI
  # needs something that speaks OpenID Connect. Published on the host as well
  # as reachable on the network, because the authorization redirect goes
  # through the browser while the token and userinfo calls come from the API.
  #
  # Version 6 dropped the bundled logging backend, so this container is silent
  # whether it is healthy or dead. The healthcheck is the only thing that tells
  # the two apart.
  oauth:
    security_opt:
      - no-new-privileges:true
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2
    environment:
      SERVER_PORT: '8080'
      JSON_CONFIG: '{"interactiveLogin":true,"tokenCallbacks":[{"issuerId":"gpool","requestMappings":[{"requestParam":"code","match":"*","claims":{"email":"e2e@zigordev.test","email_verified":true,"name":"End To End"}}]}]}'
    ports:
      - '3900:8080'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:8080/gpool/.well-known/openid-configuration >/dev/null 2>&1',
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    security_opt:
      - no-new-privileges:true
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: local
    environment:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: gpool_admin
      DB_PASSWORD: app
      DB_NAME: gpool_test
      CORS_ORIGINS: http://localhost:3101
      TRUST_PROXY: 'false'
      SWAGGER_ENABLED: 'true'
      OTEL_SERVICE_NAME: gpool-api-test
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ci-openbao-token
      OPENBAO_KV_MOUNT: kv
      OPENBAO_SECRET_PATH: gpool
      OPENBAO_REQUIRED_KEYS_API: SESSION_SECRET,SESSION_COOKIE_SECRET,GOOGLE_CLIENT_SECRET
      TOLGEE_API_URL: http://tolgee:8080
      TOLGEE_PROJECT_ID: '3'
      SESSION_SECRET: ci-session-secret
      SESSION_COOKIE_SECRET: ci-session-cookie-secret
      GOOGLE_CLIENT_ID: ci-google-id
      GOOGLE_CLIENT_SECRET: ci-google-secret
      GOOGLE_CALLBACK_URL: http://localhost:3010/auth/google/callback
      GOOGLE_AUTHORIZATION_URL: http://localhost:3900/gpool/authorize
      GOOGLE_TOKEN_URL: http://oauth:8080/gpool/token
      GOOGLE_USERINFO_URL: http://oauth:8080/gpool/userinfo
      AUTH_SUCCESS_REDIRECT_URL: http://localhost:3101/auth/callback
      AUTH_FAILURE_REDIRECT_URL: http://localhost:3101/login
      SESSION_COOKIE_SECURE: 'false'
      FRONTEND_URL: http://localhost:3101
      NOTIFICATIONS_KAFKA_BROKERS: platform-redpanda:9092
      NOTIFICATIONS_EMAIL_TOPIC: notification.email.requested.v1
    ports:
      - '3010:3000'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    security_opt:
      - no-new-privileges:true
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: local
      args:
        # Baked into the client bundle, so it has to be an address the browser
        # can reach. Every use of it is a fetch from the browser, and the
        # browser running the suite is on the host, where `api` is not a name.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3010
        NEXT_PUBLIC_RELEASE: ci
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3010
      NEXT_PUBLIC_RELEASE: ci
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ci-openbao-token
      OPENBAO_KV_MOUNT: kv
      OPENBAO_SECRET_PATH: gpool
      OPENBAO_REQUIRED_KEYS_WEB: TOLGEE_API_KEY
      TOLGEE_API_URL: http://tolgee:8080
      TOLGEE_PROJECT_ID: '3'
    ports:
      - '3101:3001'
    depends_on:
      - api

  k6_test:
    security_opt:
      - no-new-privileges:true
    image: grafana/k6:0.49.0
    environment:
      API_BASE_URL: http://api:3000
    volumes:
      - ../loadtest:/scripts:ro
      - ../artifacts:/artifacts
    command: ['run', '--summary-export', '/artifacts/k6-summary-test.json', '/scripts/health.js']
    depends_on:
      api:
        condition: service_started
