name: gpool-ci

services:
  postgres:
    security_opt:
      - no-new-privileges:true
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gpool_admin
      POSTGRES_PASSWORD: app
      POSTGRES_DB: gpool_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '5433:5432'

  api:
    security_opt:
      - no-new-privileges:true
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: local
    environment:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: gpool_admin
      DB_PASSWORD: app
      DB_NAME: gpool_test
      CORS_ORIGINS: http://localhost:3101
      TRUST_PROXY: 'false'
      SWAGGER_ENABLED: 'true'
      OTEL_SERVICE_NAME: gpool-api-test
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ci-openbao-token
      OPENBAO_KV_MOUNT: kv
      OPENBAO_SECRET_PATH: gpool
      OPENBAO_REQUIRED_KEYS_API: SESSION_SECRET,SESSION_COOKIE_SECRET,GOOGLE_CLIENT_SECRET
      TOLGEE_API_URL: http://tolgee:8080
      TOLGEE_PROJECT_ID: '3'
      SESSION_SECRET: ci-session-secret
      SESSION_COOKIE_SECRET: ci-session-cookie-secret
      GOOGLE_CLIENT_ID: ci-google-id
      GOOGLE_CLIENT_SECRET: ci-google-secret
      GOOGLE_CALLBACK_URL: http://localhost:3100/auth/google/callback
      AUTH_SUCCESS_REDIRECT_URL: http://localhost:3101/auth/callback
      AUTH_FAILURE_REDIRECT_URL: http://localhost:3101/login
      SESSION_COOKIE_SECURE: 'false'
      FRONTEND_URL: http://localhost:3101
      NOTIFICATIONS_KAFKA_BROKERS: platform-redpanda:9092
      NOTIFICATIONS_EMAIL_TOPIC: notification.email.requested.v1
    ports:
      - '3010:3000'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    security_opt:
      - no-new-privileges:true
    build:
      context: ..
      dockerfile: apps/ui/Dockerfile
      target: local
      args:
        NEXT_PUBLIC_API_BASE_URL: http://api:3000
        NEXT_PUBLIC_RELEASE: ci
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:3000
      NEXT_PUBLIC_RELEASE: ci
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ci-openbao-token
      OPENBAO_KV_MOUNT: kv
      OPENBAO_SECRET_PATH: gpool
      OPENBAO_REQUIRED_KEYS_WEB: TOLGEE_API_KEY
      TOLGEE_API_URL: http://tolgee:8080
      TOLGEE_PROJECT_ID: '3'
    ports:
      - '3101:3001'
    depends_on:
      - api

  k6_test:
    security_opt:
      - no-new-privileges:true
    image: grafana/k6:0.49.0
    environment:
      API_BASE_URL: http://api:3000
    volumes:
      - ../loadtest:/scripts:ro
      - ../artifacts:/artifacts
    command: ['run', '--summary-export', '/artifacts/k6-summary-test.json', '/scripts/health.js']
    depends_on:
      api:
        condition: service_started
