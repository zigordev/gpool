name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  quality:
    name: Quality (Lint + Typecheck + Build + Unit Coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate app compose manifests
        env:
          GP_SHARED_NETWORK: platform_ops_shared
          API_IMAGE: gpool-api:ci
          WEB_IMAGE: gpool-web:ci
          WEB_DOMAIN: app.example.com
          API_DOMAIN: api.example.com
          NODE_ENV: production
          POSTGRES_USER: gpool_admin
          POSTGRES_PASSWORD: app
          POSTGRES_DB: gpool
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_USER: gpool_admin
          DB_PASSWORD: app
          DB_NAME: gpool
          API_PORT: '3000'
          WEB_PORT: '3001'
          NEXT_PUBLIC_API_BASE_URL: http://api.example.com
          NEXT_PUBLIC_RELEASE: ci
          CORS_ORIGINS: http://localhost:3001
          TRUST_PROXY: 'false'
          SWAGGER_ENABLED: 'false'
          OTEL_SERVICE_NAME: gpool-api
          OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
          OPENBAO_ADDR: http://openbao:8200
          OPENBAO_TOKEN: ci-openbao-token
          OPENBAO_KV_MOUNT: kv
          OPENBAO_SECRET_PATH: gpool
          OPENBAO_REQUIRED_KEYS_API: AUTH_SESSION_SECRET,GOOGLE_CLIENT_SECRET
          OPENBAO_REQUIRED_KEYS_WEB: AUTH_SESSION_SECRET,TOLGEE_API_KEY
          TOLGEE_API_URL: http://tolgee:8080
          TOLGEE_PROJECT_ID: '3'
          JWT_SECRET: ci-jwt-secret
          JWT_REFRESH_SECRET: ci-jwt-refresh-secret
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: '604800'
          GOOGLE_CLIENT_ID: ci-google-id
          GOOGLE_CLIENT_SECRET: ci-google-secret
          GOOGLE_OAUTH_REDIRECT_URI: https://app.example.com/api/auth/google/callback
          FRONTEND_URL: https://app.example.com
          NOTIFICATIONS_KAFKA_BROKERS: platform-redpanda:9092
          NOTIFICATIONS_EMAIL_TOPIC: notification.email.requested.v1
        run: |
          docker compose -f docker/compose.app.local.yml config > /dev/null
          docker compose -f docker/compose.app.prod.yml config > /dev/null

      - name: Lint workspaces
        run: npm run lint

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Build workspaces
        run: npm run build --workspaces

      - name: Unit tests with coverage (api)
        run: npm run test:cov:api

      - name: Upload api coverage
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: warn

  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          set -euo pipefail
          VERSION=8.24.2
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          mkdir -p artifacts
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          grep "${ARCHIVE}" /tmp/gitleaks_checksums.txt > /tmp/gitleaks_checksum_line.txt
          (cd /tmp && sha256sum -c /tmp/gitleaks_checksum_line.txt)
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-git --redact --config .gitleaks.toml --report-format json --report-path artifacts/gitleaks-report.json

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gitleaks-report
          path: artifacts/gitleaks-report.json
          if-no-files-found: warn

  integration-e2e:
    name: Integration Smoke (Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Compose up (postgres + api + web)
        run: docker compose -f docker/compose.ci.yml up -d --build postgres api web

      - name: Wait for API
        run: |
          i=1
          while [ $i -le 60 ]; do
            if curl -fsS http://localhost:3010/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
            i=$((i+1))
          done
          docker compose -f docker/compose.ci.yml logs --no-color api
          exit 1

      - name: Verify metrics endpoint
        run: |
          curl -fsS http://localhost:3010/health > /dev/null
          metrics="$(curl -fsS http://localhost:3010/metrics)"
          printf '%s\n' "$metrics" | grep -q 'http_requests_total'
          printf '%s\n' "$metrics" | grep -q 'http_request_duration_seconds_bucket'

      - name: Export OpenAPI spec
        run: |
          mkdir -p artifacts
          docker compose -f docker/compose.ci.yml exec -T api sh -lc 'wget -qO- http://localhost:3000/docs-json' > artifacts/openapi.test.json

      - name: Regenerate web API contract
        run: npm run contract:gen:web -- artifacts/openapi.test.json apps/ui/src/lib/api/generated.ts

      - name: Enforce API contract drift
        run: git diff --exit-code -- apps/ui/src/lib/api/generated.ts

      - name: Wait for web
        run: |
          i=1
          while [ $i -le 60 ]; do
            if curl -fsS http://localhost:3101 > /dev/null; then
              echo "Web is reachable"
              exit 0
            fi
            sleep 2
            i=$((i+1))
          done
          docker compose -f docker/compose.ci.yml logs --no-color web api
          exit 1

      - name: k6 smoke
        run: |
          mkdir -p artifacts
          chmod 0777 artifacts
          docker compose -f docker/compose.ci.yml up --no-deps --no-recreate --abort-on-container-exit --exit-code-from k6_test k6_test

      - name: Upload k6 summary
        if: ${{ always() && hashFiles('artifacts/k6-summary-test.json') != '' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: k6-summary-test
          path: artifacts/k6-summary-test.json
          if-no-files-found: error

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -f docker/compose.ci.yml logs --no-color

      - name: Compose down
        if: always()
        run: docker compose -f docker/compose.ci.yml down -v

  web-smoke:
    name: Web Smoke (HTTP)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Compose up (postgres + api + web)
        run: docker compose -f docker/compose.ci.yml up -d --build postgres api web

      - name: Wait for web
        run: |
          i=1
          while [ $i -le 60 ]; do
            if curl -fsS http://localhost:3101/login > /dev/null; then
              echo "Web login route is reachable"
              exit 0
            fi
            sleep 2
            i=$((i+1))
          done
          docker compose -f docker/compose.ci.yml logs --no-color web api
          exit 1

      - name: Web and API smoke probes
        run: |
          probe() {
            name="$1"
            url="$2"
            i=1
            while [ "$i" -le 10 ]; do
              if curl -fsS --max-time 10 "$url" > /dev/null; then
                echo "$name is reachable"
                return 0
              fi
              echo "$name probe failed; retrying ($i/10)" >&2
              sleep 2
              i=$((i+1))
            done
            echo "$name probe failed after retries" >&2
            return 1
          }

          probe "Web login route" http://localhost:3101/login
          probe "API health route" http://localhost:3010/health

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -f docker/compose.ci.yml logs --no-color web api

      - name: Compose down
        if: always()
        run: docker compose -f docker/compose.ci.yml down -v

  security-supply-chain:
    name: Security + Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # A copyleft licence arriving through a transitive dependency can oblige
      # you to publish source you never intended to. Checked on every build
      # because the dangerous moment is when a licence *changes*.
      - name: Licence check (prod dependencies)
        run: node ./scripts/check-licences.mjs .

      - name: Audit dependencies (prod only, high+)
        run: npm run audit:prod:gate

      - name: Build prod images
        run: |
          docker build -f apps/api/Dockerfile --target prod -t gpool-api:ci . &
          pid_api=$!
          docker build --build-arg NEXT_PUBLIC_API_BASE_URL=http://api:3000 --build-arg NEXT_PUBLIC_RELEASE=ci -f apps/ui/Dockerfile --target prod -t gpool-web:ci . &
          pid_web=$!
          wait "$pid_api"
          wait "$pid_web"

      - name: Prepare artifacts dir
        run: mkdir -p artifacts

      - name: Generate SBOM (api image)
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0
        with:
          image: gpool-api:ci
          format: spdx-json
          output-file: artifacts/sbom-api.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (web image)
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0
        with:
          image: gpool-web:ci
          format: spdx-json
          output-file: artifacts/sbom-web.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SBOM files
        run: |
          test -s artifacts/sbom-api.spdx.json
          test -s artifacts/sbom-web.spdx.json
          jq -e '.spdxVersion and (.packages | type == "array")' artifacts/sbom-api.spdx.json
          jq -e '.spdxVersion and (.packages | type == "array")' artifacts/sbom-web.spdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sbom
          path: |
            artifacts/sbom-api.spdx.json
            artifacts/sbom-web.spdx.json
          if-no-files-found: error

      - name: Trivy scan (api image)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: gpool-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Trivy scan (web image)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: gpool-web:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # Semgrep rather than CodeQL: CodeQL code scanning on a *private* repository
    # requires GitHub Code Security, a paid add-on. The CodeQL workflow beside
    # this one is gated on `!repository.private` for that reason and never runs.
    # Semgrep needs no add-on, so this is the job that actually scans.
    #
    # Findings fail the build and appear in the job log. Uploading SARIF to the
    # Security tab needs the same paid add-on, so the log is the report.
    #
    # Excluded rules, each reviewed rather than waved through:
    #   missing-user: container hardening — backlog
    #   missing-user-entrypoint: container hardening — backlog
    #   writable-filesystem-service: container hardening — backlog
    #   no-new-privileges: container hardening — backlog
    #   ifs-tampering: IFS is saved and restored around the loop
    #   detected-generic-secret: entropy heuristic; gitleaks already covers secrets
    #   prototype-pollution-loop: read-only tree walks, guarded with hasOwnProperty; no assignment
    #   incomplete-sanitization: stripping '%' from a formatted percentage, not sanitisation
    #   detect-non-literal-regexp: locale comes from a fixed list, in a build script
    #   aws-subnet-has-public-ip-address: single public host by design; there is no NAT gateway
    container:
      image: semgrep/semgrep:1.99.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Scan
        # `semgrep scan`, not `semgrep ci`: the latter expects a Semgrep AppSec
        # Platform token and behaves differently without one. `--error` is what
        # turns a finding into a failed job rather than a printed note.
        run: |
          semgrep scan \
            --config p/default \
            --config p/secrets \
            --exclude-rule dockerfile.security.missing-user.missing-user \
            --exclude-rule dockerfile.security.missing-user-entrypoint.missing-user-entrypoint \
            --exclude-rule yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service \
            --exclude-rule yaml.docker-compose.security.no-new-privileges.no-new-privileges \
            --exclude-rule bash.lang.security.ifs-tampering.ifs-tampering \
            --exclude-rule generic.secrets.security.detected-generic-secret.detected-generic-secret \
            --exclude-rule javascript.lang.security.audit.prototype-pollution.prototype-pollution-loop.prototype-pollution-loop \
            --exclude-rule javascript.lang.security.audit.incomplete-sanitization.incomplete-sanitization \
            --exclude-rule javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp \
            --exclude-rule terraform.aws.security.aws-subnet-has-public-ip-address.aws-subnet-has-public-ip-address \
            --error \
            --metrics=off
