name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two merges in quick succession would otherwise start two runs that both
# try to create the same release branch, tag and pull request. Queued rather
# than cancelled: a run interrupted between tagging and publishing leaves
# state the next one has to reconcile.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
